[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shreyansh", email = "shreyanshd94@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "groq>=1.7.0",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
